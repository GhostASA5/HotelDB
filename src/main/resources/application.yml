spring:
  application:
    name: HostelBooking

  jpa:
    generate-ddl: false
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:postgresql://localhost:5436/hotelBooking
    username: operator
    password: operator_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: hotel
      connection-timeout: 10000
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: hotel


server:
  port: 8088

